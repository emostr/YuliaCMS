<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/yulia.css' | relative_url }}">

{%- comment -%}
  Self-hosted so the documentation does not report its readers to a font CDN,
  and keeps working when that CDN does not. The files ship with the product.
{%- endcomment -%}
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>Y</text></svg>">

<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:type" content="website">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
