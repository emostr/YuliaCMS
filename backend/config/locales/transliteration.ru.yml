# How Cyrillic becomes Latin when a title is turned into a URL.
#
# I18n.transliterate has no rules for Russian, so without this table a site
# named "Кофейня «Пар»" produced an empty slug. The scheme is the ordinary
# practical one people already expect from Russian URLs, not a strict standard:
# "щ" is "sch" rather than "shh" because that is what a reader recognises.
ru:
  i18n:
    transliterate:
      rule:
        "а": "a"
        "б": "b"
        "в": "v"
        "г": "g"
        "д": "d"
        "е": "e"
        "ё": "e"
        "ж": "zh"
        "з": "z"
        "и": "i"
        "й": "y"
        "к": "k"
        "л": "l"
        "м": "m"
        "н": "n"
        "о": "o"
        "п": "p"
        "р": "r"
        "с": "s"
        "т": "t"
        "у": "u"
        "ф": "f"
        "х": "h"
        "ц": "ts"
        "ч": "ch"
        "ш": "sh"
        "щ": "sch"
        # The hard and soft signs have no sound of their own; dropping them
        # reads better than any letter would.
        "ъ": ""
        "ы": "y"
        "ь": ""
        "э": "e"
        "ю": "yu"
        "я": "ya"
        "А": "A"
        "Б": "B"
        "В": "V"
        "Г": "G"
        "Д": "D"
        "Е": "E"
        "Ё": "E"
        "Ж": "Zh"
        "З": "Z"
        "И": "I"
        "Й": "Y"
        "К": "K"
        "Л": "L"
        "М": "M"
        "Н": "N"
        "О": "O"
        "П": "P"
        "Р": "R"
        "С": "S"
        "Т": "T"
        "У": "U"
        "Ф": "F"
        "Х": "H"
        "Ц": "Ts"
        "Ч": "Ch"
        "Ш": "Sh"
        "Щ": "Sch"
        "Ъ": ""
        "Ы": "Y"
        "Ь": ""
        "Э": "E"
        "Ю": "Yu"
        "Я": "Ya"
